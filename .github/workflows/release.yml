name: Release

# Self-contained desktop builds.
# - workflow_dispatch uploads the archives as workflow artifacts.
# - a v* tag does that and also creates a GitHub Release with the archives attached.
#
# macOS archives are unsigned .app bundles inside a zip. Signing (Developer ID,
# hardened runtime with com.apple.security.cs.allow-jit) and notarization are a
# follow-up: they need an Apple certificate and a notarytool profile, and they
# must not set IncludeNativeLibrariesForSelfExtract (that breaks CoreCLR on macOS).

on:
  push:
    tags:
      - "v*"
    # Temporary, so this branch can produce the publish artifacts before the
    # workflow file exists on the default branch (workflow_dispatch will not
    # start until then). Remove this branches filter after that run.
    branches:
      - cursor/add-release-workflow-4d40
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          # macOS runners so the .app zip is written with ditto (permissions Finder keeps).
          # osx-x64 is cross-published from the Apple silicon image.
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Mdhub.csproj

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="${GITHUB_REF#refs/tags/v}"
          else
            label="0.0.0+${GITHUB_SHA:0:7}"
          fi
          if [[ "$label" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))? ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[3]:-0}"
            patch="${BASH_REMATCH[5]:-0}"
            bundle="${major}.${minor}.${patch}"
          else
            bundle="0.0.0"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Release label: $label"
          echo "Bundle version: $bundle"

      - name: Package
        run: |
          bash scripts/package-release.sh \
            --rid "${{ matrix.rid }}" \
            --version "${{ steps.version.outputs.bundle }}" \
            --label "${{ steps.version.outputs.label }}" \
            --output artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false keeps the zip itself as the artifact (the file name
          # becomes the artifact name; do not wrap it in a second zip).
          path: artifacts/mdhub-${{ matrix.rid }}.zip
          archive: false
          if-no-files-found: error
          compression-level: 0

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mdhub-*
          merge-multiple: true
          skip-decompress: true

      - name: Check archives
        run: |
          set -euo pipefail
          ls -lh dist
          test -f dist/mdhub-win-x64.zip
          test -f dist/mdhub-osx-arm64.zip
          test -f dist/mdhub-osx-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/mdhub-win-x64.zip
            dist/mdhub-osx-arm64.zip
            dist/mdhub-osx-x64.zip
          body: |
            Self-contained mdhub builds. No .NET install is required.

            - `mdhub-win-x64.zip` — unzip and run `mdhub-win-x64/Mdhub.exe`
            - `mdhub-osx-arm64.zip` — unsigned `Mdhub.app` for Apple silicon
            - `mdhub-osx-x64.zip` — unsigned `Mdhub.app` for Intel Macs

            The macOS bundles are not signed or notarized. Gatekeeper will block them until a follow-up adds Developer ID signing (hardened runtime, including `com.apple.security.cs.allow-jit`) and notarization.
