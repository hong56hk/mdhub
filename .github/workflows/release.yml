name: Release

# Self-contained desktop builds. The version comes from the v* tag
# (v1.0.0 -> 1.0.0). workflow_dispatch uses 0.0.0 and does not publish a release.
#
# Assets:
# - Mdhub-<version>-win-x64.exe  one self-contained executable
#   (PublishSingleFile + IncludeNativeLibrariesForSelfExtract)
# - Mdhub-<version>-osx-arm64.dmg and Mdhub-<version>-osx-x64.dmg
#   each disk image contains an unsigned Mdhub.app
#
# macOS is not a single-file bundle: IncludeNativeLibrariesForSelfExtract
# breaks CoreCLR there. Signing and notarization are a follow-up.
# The GitHub Release body is docs/release-notes/<tag>.md (for example
# docs/release-notes/v1.0.0.md).

on:
  push:
    tags:
      - "v*"
    # Temporary, so this branch can produce the three assets. Remove before merge.
    branches:
      - "cursor/v1-release-assets-9347"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: exe
          # macOS runners: hdiutil writes the dmg, and osx-x64 is cross-published
          # from the Apple silicon image.
          - rid: osx-arm64
            os: macos-latest
            ext: dmg
          - rid: osx-x64
            os: macos-latest
            ext: dmg
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          test -f "docs/release-notes/${GITHUB_REF_NAME}.md"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Mdhub.csproj

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="${GITHUB_REF#refs/tags/v}"
          else
            label="0.0.0+${GITHUB_SHA:0:7}"
          fi
          if [[ "$label" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))? ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[3]:-0}"
            patch="${BASH_REMATCH[5]:-0}"
            bundle="${major}.${minor}.${patch}"
          else
            bundle="0.0.0"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Release label: $label"
          echo "Bundle version: $bundle"

      - name: Package
        run: |
          bash scripts/package-release.sh \
            --rid "${{ matrix.rid }}" \
            --version "${{ steps.version.outputs.bundle }}" \
            --label "${{ steps.version.outputs.label }}" \
            --output artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false keeps the exe or dmg itself as the artifact.
          path: artifacts/Mdhub-${{ steps.version.outputs.bundle }}-${{ matrix.rid }}.${{ matrix.ext }}
          archive: false
          if-no-files-found: error
          compression-level: 0

  verify-assets:
    name: Verify assets
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: Mdhub-*
          merge-multiple: true
          skip-decompress: true

      - name: Check the exe and disk images
        run: |
          set -euo pipefail
          shopt -s nullglob
          exe=(dist/Mdhub-*-win-x64.exe)
          arm=(dist/Mdhub-*-osx-arm64.dmg)
          intel=(dist/Mdhub-*-osx-x64.dmg)
          test "${#exe[@]}" -eq 1
          test "${#arm[@]}" -eq 1
          test "${#intel[@]}" -eq 1
          # The non-tag filename is Mdhub-0.0.0-*. A v1.0.0 tag produces Mdhub-1.0.0-*.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="${GITHUB_REF_NAME#v}"
            if [[ "$label" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))? ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[3]:-0}.${BASH_REMATCH[5]:-0}"
            else
              echo "tag is not a version: $label" >&2
              exit 1
            fi
            test -f "dist/Mdhub-${version}-win-x64.exe"
            test -f "dist/Mdhub-${version}-osx-arm64.dmg"
            test -f "dist/Mdhub-${version}-osx-x64.dmg"
          fi
          python3 scripts/verify-single-file.py "${exe[0]}"
          for dmg in "${arm[0]}" "${intel[0]}"; do
            sig="$(tail -c 512 "$dmg" | head -c 4)"
            test "$sig" = "koly"
            bytes="$(wc -c < "$dmg" | tr -d ' ')"
            test "$bytes" -gt 15000000
            echo "DMG_OK $dmg bytes=$bytes"
          done
          echo "ASSET_SIZES"
          wc -c "${exe[0]}" "${arm[0]}" "${intel[0]}"
          {
            echo "## Release assets"
            echo
            echo '```'
            wc -c "${exe[0]}" "${arm[0]}" "${intel[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub Release
    needs: verify-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: Mdhub-*
          merge-multiple: true
          skip-decompress: true

      - name: Check assets and notes
        run: |
          set -euo pipefail
          label="${GITHUB_REF_NAME#v}"
          if [[ "$label" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))? ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[3]:-0}.${BASH_REMATCH[5]:-0}"
          else
            echo "tag is not a version: $label" >&2
            exit 1
          fi
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          test -f "dist/Mdhub-${version}-win-x64.exe"
          test -f "dist/Mdhub-${version}-osx-arm64.dmg"
          test -f "dist/Mdhub-${version}-osx-x64.dmg"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ github.workspace }}/docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/Mdhub-*-win-x64.exe
            dist/Mdhub-*-osx-arm64.dmg
            dist/Mdhub-*-osx-x64.dmg
